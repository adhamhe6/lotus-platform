[project]
name = "lotus-platform"
version = "1.0.0"
description = "Lotus Platform — evidence-grounded AI data analysis for qualitative, quantitative and mixed-methods research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0,<6",
    "arq>=0.26",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it automatically → protects against XML entity-expansion attacks in uploaded workbooks
    "joblib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
nlp = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["PT018", "PT011", "B008", "RUF012", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "E501", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["integration: needs PostgreSQL + Redis", "e2e: end-to-end API workflow"]

# pandas-stubs / numpy typing is too coarse for dataframe-heavy numerical code; these modules are covered by known-answer unit tests instead.
[[tool.mypy.overrides]]
module = ["app.datasets.*", "app.analysis.*", "app.qualitative.*", "app.visualization.*", "app.mixed.*", "app.reports.svg"]
disable_error_code = ["arg-type", "assignment", "call-overload", "union-attr", "misc", "attr-defined", "operator", "index", "valid-type", "var-annotated", "return-value", "no-any-return"]
