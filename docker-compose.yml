# docker compose up --build        →  UI http://localhost:8080 · API docs http://localhost:8080/api/docs
# Requires a .env (see .env.example): SECRET_KEY and POSTGRES_PASSWORD.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lotus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-lotus}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  STORAGE_DIR: /data/storage
  JOB_BACKEND: arq
  AI_PROVIDER: ${AI_PROVIDER:-deterministic}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-tfidf-lsa}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lotus}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: apply migrations, then (optionally) seed the demo workspace.
  migrate:
    build: ./backend
    image: lotus-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.bootstrap"]
    environment: *backend-env
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    image: lotus-backend:local
    environment: *backend-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]   # not published: only the nginx frontend reaches the API (so X-Forwarded-For can be trusted)
    restart: unless-stopped

  worker:
    build: ./backend
    image: lotus-backend:local
    command: ["arq", "app.workers.queue.WorkerSettings"]
    environment: *backend-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.queue.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: lotus-frontend:local
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]
    restart: unless-stopped

  # Optional self-hosted LLM:  docker compose --profile ollama up   (then set AI_PROVIDER=openai_compatible, AI_BASE_URL=http://ollama:11434/v1)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  ollama:
